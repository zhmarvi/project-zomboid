{{- $secret := required "server.existingSecret.name is required; create the admin-password Secret first" .Values.server.existingSecret.name -}}
{{- if eq (int .Values.service.gamePort) (int .Values.service.directPort) -}}
{{- fail "service.gamePort and service.directPort must differ" -}}
{{- end -}}
{{- if le (int .Values.terminationGracePeriodSeconds) (add (int .Values.server.shutdownTimeout) 5) -}}
{{- fail "terminationGracePeriodSeconds must exceed server.shutdownTimeout + 5" -}}
{{- end -}}
{{- if and .Values.hostNetwork (ne .Values.service.type "ClusterIP") -}}
{{- fail "Use service.type=ClusterIP with hostNetwork=true; clients connect to node IP" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pz.fullname" . }}
  labels:
    {{- include "pz.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pz.fullname" . }}-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "pz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pz.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml (mergeOverwrite (deepCopy .Values.nodeSelector) (dict "kubernetes.io/arch" "amd64" "kubernetes.io/os" "linux")) | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: {{ include "pz.fullname" . }}
          env:
            - name: ADMIN_PASSWORD_FILE
              value: /run/secrets/zomboid/admin-password
            - name: SERVER_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: game
              containerPort: {{ .Values.service.gamePort }}
              protocol: UDP
            - name: direct
              containerPort: {{ .Values.service.directPort }}
              protocol: UDP
          # No liveness restart during Steam downloads, world loads, or backups.
          readinessProbe:
            exec:
              command: [/usr/local/bin/healthcheck.sh]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: server
              mountPath: /server
            - name: data
              mountPath: /data
            - name: home
              mountPath: /home/steam
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run/zomboid
            - name: admin
              mountPath: /run/secrets/zomboid
              readOnly: true
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: admin
          secret:
            secretName: {{ $secret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.server.existingSecret.key }}
                path: admin-password
        {{- range $name, $storage := .Values.persistence }}
        {{- if $storage.existingClaim }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $storage.existingClaim }}
        {{- end }}
        {{- end }}
  {{- if or (not .Values.persistence.server.existingClaim) (not .Values.persistence.data.existingClaim) }}
  volumeClaimTemplates:
    {{- range $name, $storage := .Values.persistence }}
    {{- if not $storage.existingClaim }}
    - metadata:
        name: {{ $name }}
      spec:
        accessModes:
          {{- toYaml $storage.accessModes | nindent 10 }}
        {{- if eq $storage.storageClass "-" }}
        storageClassName: ""
        {{- else if $storage.storageClass }}
        storageClassName: {{ $storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $storage.size }}
    {{- end }}
    {{- end }}
  {{- end }}
