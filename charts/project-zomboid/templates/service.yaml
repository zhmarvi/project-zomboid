apiVersion: v1
kind: Service
metadata:
  name: {{ include "pz.fullname" . }}
  labels:
    {{- include "pz.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if ne .Values.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP | quote }}
  {{- end }}
  selector:
    {{- include "pz.selectorLabels" . | nindent 4 }}
  ports:
    - name: game
      port: {{ .Values.service.gamePort }}
      targetPort: game
      protocol: UDP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePorts.game }}
      {{- end }}
    - name: direct
      port: {{ .Values.service.directPort }}
      targetPort: direct
      protocol: UDP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePorts.direct }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pz.fullname" . }}-headless
  labels:
    {{- include "pz.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "pz.selectorLabels" . | nindent 4 }}
  ports:
    - name: game
      port: {{ .Values.service.gamePort }}
      protocol: UDP
