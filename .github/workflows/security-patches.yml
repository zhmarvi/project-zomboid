name: Security patches
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  packages: read
concurrency:
  group: security-patches
  cancel-in-progress: false
jobs:
  scan-and-rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published AMD64 image
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          docker save "$IMAGE" -o published-image.tar
      - name: Scan all OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.74.0
          input: published-image.tar
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "0"
          timeout: 15m
      - name: Check available Debian fixes
        id: patches
        run: |
          # Give the image only the scan, patch generator, and a scratch directory.
          # No checkout metadata or GitHub token is mounted in the container.
          patch_dir=$(mktemp -d "${RUNNER_TEMP}/security-patches.XXXXXX")
          cp security/apt-packages.txt "$patch_dir/apt-packages.txt"
          docker run --rm --user 0:0 --entrypoint /bin/bash \
            --mount "type=bind,src=${PWD}/trivy-report.json,dst=/scan/report.json,readonly" \
            --mount "type=bind,src=${PWD}/scripts/propose-security-patches.py,dst=/scan/propose.py,readonly" \
            --mount "type=bind,src=${patch_dir},dst=/scan/output" \
            "$IMAGE" -ec \
            'apt-get update >/dev/null && python3 /scan/propose.py /scan/report.json /scan/output/apt-packages.txt /scan/output/status.json'
          cp "$patch_dir/apt-packages.txt" security/apt-packages.txt
          cp "$patch_dir/status.json" security-patch-status.json
          echo "findings=$(jq -r .findings security-patch-status.json)" >> "$GITHUB_OUTPUT"
          echo "actionable=$(jq -r .actionable security-patch-status.json)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(jq -r '.skipped | length' security-patch-status.json)" >> "$GITHUB_OUTPUT"
      - name: Keep the complete scan and patch decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: security-patch-report-${{ github.run_id }}
          path: |
            trivy-report.json
            security-patch-status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit actionable package guards and start a fresh image build
        id: dispatch
        if: steps.patches.outputs.actionable != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- security/apt-packages.txt; then
            git add security/apt-packages.txt
            git commit -m "Record available Debian security fixes"
            gh auth setup-git
            git push origin HEAD:main
          fi
          # Commits made with GITHUB_TOKEN do not trigger push workflows.
          # workflow_dispatch explicitly rebuilds, rescans, and tests the image.
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/container.yml/dispatches" \
            -f ref=main
      - name: Report unresolved findings
        if: always() && steps.patches.outcome == 'success'
        env:
          FINDINGS: ${{ steps.patches.outputs.findings }}
          ACTIONABLE: ${{ steps.patches.outputs.actionable }}
          SKIPPED: ${{ steps.patches.outputs.skipped }}
        run: |
          {
            echo '### Published image vulnerability scan'
            echo "Fixable High/Critical findings: $FINDINGS"
            echo "Debian findings with an available APT fix: $ACTIONABLE"
            echo "Findings requiring manual review: $SKIPPED"
            if [[ '${{ steps.dispatch.outcome }}' == success ]]; then
              echo 'A fresh Container workflow run was requested. It will rescan and test before publishing.'
            fi
            echo 'The full scan and skipped-finding reasons are in the report artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( SKIPPED > 0 || (FINDINGS > 0 && ACTIONABLE == 0) )); then
            echo 'Some fixable High/Critical findings cannot be handled by Debian APT; review the report.' >&2
            exit 1
          fi
