name: Container
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      build_image: ${{ steps.image-changes.outputs.build_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Check image build inputs
        id: image-changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Releases and periodic/manual runs rebuild to pick up fresh Debian packages.
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "build_image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rebuild conservatively when the prior commit cannot be compared.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "build_image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep these paths in sync with the Dockerfile's COPY inputs.
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            Dockerfile .dockerignore security/apt-packages.txt \
            scripts/security-updates.sh scripts/entrypoint.sh \
            scripts/healthcheck.sh scripts/console.sh scripts/configure.py; then
            echo "build_image=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_image=true" >> "$GITHUB_OUTPUT"
          fi
      - run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v3.17.3
      - run: ./scripts/validate.sh
  build:
    needs: validate
    if: needs.validate.outputs.build_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=build-{{date 'YYYYMMDD-HHmmss' tz='UTC'}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build AMD64 image with fresh Debian packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache-filters: runtime
          load: true
          tags: project-zomboid:ci
          labels: ${{ steps.metadata.outputs.labels }}
          # Scan/test the exact local image before pushing any registry tags.
          provenance: false
          sbom: false
      - name: Export image for scan
        run: docker save project-zomboid:ci -o image.tar
      - name: Report all OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.74.0
          input: image.tar
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "0"
          timeout: 15m
      - name: Keep full report (including unfixed findings)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: vulnerability-report-${{ github.run_id }}
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Reject fixable High and Critical findings
        run: python3 scripts/check-vulnerabilities.py trivy-report.json
      - name: Test SteamCMD, native game boot, and graceful shutdown
        run: ./tests/smoke-container.sh project-zomboid:ci
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned and tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag project-zomboid:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          docker inspect project-zomboid:ci --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
