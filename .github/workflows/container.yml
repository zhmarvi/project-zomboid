name: Container
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42  # v5
        with:
          version: v3.17.3
      - run: ./scripts/validate.sh
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=build-{{date 'YYYYMMDD-HHmmss' tz='UTC'}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build AMD64 image with fresh Debian packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache-filters: runtime
          load: true
          tags: project-zomboid:ci
          labels: ${{ steps.metadata.outputs.labels }}
          # Scan/test the exact local image before pushing any registry tags.
          provenance: false
          sbom: false
      - name: Export image for scan
        run: docker save project-zomboid:ci -o image.tar
      - name: Report all OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.74.0
          input: image.tar
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: "0"
          timeout: 15m
      - name: Keep full report (including unfixed findings)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: vulnerability-report-${{ github.run_id }}
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Reject fixable High and Critical findings
        run: python3 scripts/check-vulnerabilities.py trivy-report.json
      - name: Test SteamCMD, native game boot, and graceful shutdown
        run: ./tests/smoke-container.sh project-zomboid:ci
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned and tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag project-zomboid:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          docker inspect project-zomboid:ci --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
